// ══ CUSTOS FIXOS, SALDO E METAS (diálogo) ══
// ══════════════════════════════════════════════
let editando=null;
function renderDialogo(foco){
  const dlg=document.getElementById('dlg');
  const sug=sugestoesFixos();
  const c=editando?F.custos.find(x=>x.id===editando):null;
  const ativos=F.custos.filter(x=>x.ativo!==false), total=soma(ativos.filter(x=>!x.fim||x.fim>=ymOf(HOJE)),x=>+x.valor);
  dlg.innerHTML=`
    <div class="dlg-h"><div class="sec-title"><i class="ti ti-adjustments" aria-hidden="true"></i>Custos fixos, salários e saldo</div><button class="btn btn-ghost btn-sm" data-acao="fechar" aria-label="Fechar"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="dlg-b">
      ${sug.length?`<div class="sec-title sm" style="margin-top:0"><i class="ti ti-wand" aria-hidden="true"></i>Gastos que se repetem nas Saídas</div>
        <p class="hint" style="margin:0 0 8px">Já estão lançados no CRM. Ao adicionar, eles contam no ponto de equilíbrio sem duplicar no caixa.</p>
        ${sug.map(s=>`<div class="sug"><div class="sug-t">${esc(s.desc)}<small>${brl(s.valor)} por mês · ${s.meses.size} meses nas Saídas · vira "${esc(s.catFixo)}"</small></div>
          <button class="btn btn-sm" data-acao="sug-add" data-alvo="${esc(s.chave)}"><i class="ti ti-plus" aria-hidden="true"></i>Adicionar</button>
          <button class="btn btn-sm btn-ghost" data-acao="sug-ign" data-alvo="${esc(s.chave)}">Ignorar</button></div>`).join('')}`:''}
      <div class="sec-title sm"><i class="ti ti-list-details" aria-hidden="true"></i>Custos fixos mensais ${ativos.length?`<span class="badge b-neutro">${brl(total)} por mês</span>`:''}</div>
      ${F.custos.length?`<div class="table-wrap"><table class="t"><thead><tr><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th class="num">Dia</th><th class="num">Vigência</th><th></th></tr></thead><tbody>
        ${F.custos.map(x=>`<tr style="${x.ativo===false?'opacity:.55':''}"><td>${esc(x.desc)}${x.vinculo?' <span class="badge b-neutro" title="Já lançado em Saídas no CRM">nas Saídas</span>':''}</td><td>${esc(x.cat)}</td><td class="num">${brl(+x.valor)}</td><td class="num">${x.dia||'—'}</td><td class="num">${x.inicio?nomeMes(x.inicio):'sempre'}${x.fim?' a '+nomeMes(x.fim):''}</td>
          <td class="num"><button class="btn btn-ghost btn-sm" data-acao="fx-edit" data-alvo="${x.id}" aria-label="Editar"><i class="ti ti-pencil" aria-hidden="true"></i></button><button class="btn btn-ghost btn-sm" data-acao="fx-del" data-alvo="${x.id}" aria-label="Excluir"><i class="ti ti-trash" aria-hidden="true"></i></button></td></tr>`).join('')}
      </tbody></table></div>`:'<div class="vazio">Nenhum custo fixo ainda.</div>'}
      <div class="sec-title sm"><i class="ti ti-${c?'pencil':'plus'}" aria-hidden="true"></i>${c?'Editar custo fixo':'Novo custo fixo'}</div>
      <div class="form-grid">
        <div class="fg" style="grid-column:span 2"><label for="fx-desc">Descrição</label><input id="fx-desc" maxlength="80" placeholder="Pró-labore Eduardo" value="${esc(c?c.desc:'')}"></div>
        <div class="fg"><label for="fx-cat">Categoria</label><select id="fx-cat">${CATS_FIXOS.map(k=>`<option${(c?c.cat:'Pró-labore')===k?' selected':''}>${k}</option>`).join('')}</select></div>
        <div class="fg"><label for="fx-valor">Valor por mês (R$)</label><input id="fx-valor" type="number" min="0" step="0.01" inputmode="decimal" placeholder="1500,00" value="${c?c.valor:''}"></div>
        <div class="fg"><label for="fx-dia">Dia do pagamento</label><input id="fx-dia" type="number" min="1" max="31" placeholder="10" value="${c&&c.dia?c.dia:''}"></div>
        <div class="fg"><label for="fx-ini">Desde (opcional)</label><input id="fx-ini" type="month" value="${c&&c.inicio?c.inicio:''}"></div>
        <div class="fg"><label for="fx-fim">Até (opcional)</label><input id="fx-fim" type="month" value="${c&&c.fim?c.fim:''}"></div>
        <label class="fg fg-check" style="grid-column:span 2"><input type="checkbox" id="fx-vinc" ${c&&c.vinculo?'checked':''}> Já lanço este custo em Saídas no CRM, com esta mesma descrição</label>
      </div>
      <div class="err" id="fx-err" hidden></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-primary" data-acao="fx-salvar"><i class="ti ti-check" aria-hidden="true"></i>${c?'Salvar alterações':'Adicionar custo'}</button>
        ${c?'<button class="btn" data-acao="fx-cancelar">Cancelar</button>':''}
      </div>
      <p class="hint">Salários e pró-labore também alimentam o módulo de folha. Parcelas de impressora não entram aqui: o retorno delas já está no custo de cada peça.</p>

      <div class="sec-title sm" id="bloco-saldo"><i class="ti ti-wallet" aria-hidden="true"></i>Saldo em caixa</div>
      <div class="form-grid">
        <div class="fg"><label for="sd-valor">Saldo (R$)</label><input id="sd-valor" type="number" step="0.01" inputmode="decimal" placeholder="850,00" value="${F.saldo&&F.saldo.valor!=null?F.saldo.valor:''}"></div>
        <div class="fg"><label for="sd-data">Na data</label><input id="sd-data" type="date" value="${F.saldo&&F.saldo.data?F.saldo.data:ymOf(HOJE)+'-'+String(HOJE.getDate()).padStart(2,'0')}"></div>
        <div class="fg"><label for="mt-margem">Meta de margem econômica (%)</label><input id="mt-margem" type="number" min="0" max="95" step="1" value="${+F.metaMargem||30}"></div>
        <div class="fg"><button class="btn" data-acao="sd-salvar"><i class="ti ti-device-floppy" aria-hidden="true"></i>Salvar saldo e meta</button></div>
      </div>
      <div class="err" id="sd-err" hidden></div>
      <p class="hint">Informe o saldo de um dia qualquer (conta da empresa + caixinha). O painel soma o que entrou e saiu depois disso para chegar no saldo de hoje.</p>
    </div>`;
  if(foco==='saldo') setTimeout(()=>{document.getElementById('bloco-saldo').scrollIntoView({block:'start'});document.getElementById('sd-valor').focus();},30);
}
function abrirDialogo(foco){
  if(!D){toast('Carregue os dados do CRM primeiro.');return;}
  editando=null; renderDialogo(foco);
  const dlg=document.getElementById('dlg'); if(!dlg.open) dlg.showModal();
}
function erro(id,msg){const e=document.getElementById(id);e.textContent=msg;e.hidden=!msg;}
function salvarCusto(){
  const desc=document.getElementById('fx-desc').value.trim();
  const valor=parseFloat(String(document.getElementById('fx-valor').value).replace(',','.'));
  const dia=parseInt(document.getElementById('fx-dia').value)||null;
  const ini=document.getElementById('fx-ini').value||null, fim=document.getElementById('fx-fim').value||null;
  if(!desc) return erro('fx-err','Escreva uma descrição.');
  if(!(valor>0)) return erro('fx-err','Informe um valor maior que zero.');
  if(dia&&(dia<1||dia>31)) return erro('fx-err','O dia precisa estar entre 1 e 31.');
  if(ini&&fim&&fim<ini) return erro('fx-err','O mês final é antes do inicial.');
  const vinc=document.getElementById('fx-vinc').checked;
  const dados={desc,cat:document.getElementById('fx-cat').value,valor:Math.round(valor*100)/100,dia,inicio:ini,fim,ativo:true,vinculo:vinc?norm(desc):null};
  if(vinc&&!D.saidas.some(s=>norm(s.desc)===dados.vinculo)) toast('Atenção: não achei nenhuma Saída com essa descrição.');
  if(editando){Object.assign(F.custos.find(x=>x.id===editando),dados);}
  else F.custos.push(Object.assign({id:uid()},dados));
  editando=null; salvarFin(); render(); toast('Custo fixo salvo.');
}
function salvarSaldo(){
  const raw=String(document.getElementById('sd-valor').value).trim();
  const valor=raw===''?null:parseFloat(raw.replace(',','.'));
  const data=document.getElementById('sd-data').value;
  const meta=parseFloat(document.getElementById('mt-margem').value);
  if(raw!==''&&!isFinite(valor)) return erro('sd-err','Saldo inválido.');
  if(valor!==null&&!dt(data)) return erro('sd-err','Escolha a data do saldo.');
  if(valor!==null&&dt(data)>HOJE) return erro('sd-err','A data do saldo não pode estar no futuro.');
  if(!(meta>=0&&meta<=95)) return erro('sd-err','A meta de margem precisa estar entre 0 e 95%.');
  F.saldo={valor,data:valor===null?null:data}; F.metaMargem=meta;
  salvarFin(); render(); toast('Saldo e meta salvos.');
}

// ══════════════════════════════════════════════
// ══ GOOGLE DRIVE (mesmo app do CRM, pasta appData) ══
// ══ Lê crm_data.json (nunca escreve nele). Guarda os custos em fin_data.json. ══
// ══════════════════════════════════════════════
let tokenClient=null, accessToken=null, tokenExp=0, finFileId=null, driveBusy=false, finTimer=null;
function setDrive(estado,msg){
  const b=document.getElementById('btn-drive'); if(!b) return;
  const ic={off:'ti-cloud',conectando:'ti-loader-2',sinc:'ti-cloud-up',ok:'ti-cloud-check',erro:'ti-cloud-x'}[estado]||'ti-cloud';
  b.className='btn '+({ok:'drive-ok',erro:'drive-erro',sinc:'drive-sinc',conectando:'drive-sinc'}[estado]||'');
  b.innerHTML=`<i class="ti ${ic}" aria-hidden="true"></i><span class="lbl">${estado==='ok'?'Drive':estado==='erro'?'Drive':estado==='off'?'Drive':'…'}</span>`;
  b.title=msg||{off:'Buscar os dados mais novos no Google Drive',conectando:'Conectando…',sinc:'Sincronizando…',ok:'Sincronizado com o Google Drive (clique para atualizar)',erro:'Erro no Google Drive'}[estado];
}
function driveInit(){
  if(!window.google||!google.accounts||!google.accounts.oauth2){setTimeout(driveInit,300);return;}
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:GDRIVE_CLIENT_ID,scope:GDRIVE_SCOPE,callback:onToken,
    error_callback:()=>setDrive('erro','Login cancelado ou bloqueado')});
  // Se o CRM já está conectado ao Drive neste navegador, tenta sem pedir login de novo
  if(localStorage.getItem('p3d_v2_gdrive_on')==='1'){setDrive('conectando');tokenClient.requestAccessToken({prompt:''});}
  else setDrive('off');
}
async function onToken(resp){
  if(resp.error){setDrive('erro','Não autorizado');return;}
  accessToken=resp.access_token; tokenExp=Date.now()+(resp.expires_in*1000-60000);
  await driveSincronizar();
}
function driveClick(){
  if(!tokenClient){toast('Carregando o Google, aguarde um instante…');return;}
  if(accessToken&&Date.now()<tokenExp){driveSincronizar();return;}
  tokenClient.requestAccessToken({prompt:localStorage.getItem('p3d_v2_gdrive_on')==='1'?'':'consent'});
}
async function driveFetch(url,opt={}){
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+accessToken})}));
  if(!r.ok) throw new Error('Google Drive respondeu '+r.status);
  return r;
}
async function driveAchar(nome){
  const q=encodeURIComponent(`name='${nome}'`);
  const j=await (await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`)).json();
  return (j.files&&j.files[0])||null;
}
async function driveBaixar(id){return (await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();}
async function driveGravarFin(){
  const body=JSON.stringify(F);
  if(finFileId) return (await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${finFileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body})).json();
  const bd='p3dfinboundary', meta={name:FIN_FILE,parents:['appDataFolder']};
  const corpo=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  return (await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${bd}`},body:corpo})).json();
}
async function driveSincronizar(){
  if(driveBusy) return; driveBusy=true; setDrive('sinc');
  try{
    const crm=await driveAchar(CRM_FILE);
    if(crm){
      const tNuvem=Date.parse(crm.modifiedTime)||0, tLocal=fonte.tipo==='local'&&fonte.quando?Date.parse(fonte.quando)||0:0;
      if(!D||fonte.tipo==='arquivo'||tNuvem>tLocal+2000){
        const d=await driveBaixar(crm.id);
        if(Array.isArray(d.vendas)){usarDados(d,{tipo:'drive',quando:crm.modifiedTime,nome:'Google Drive'});toast('Dados do CRM atualizados do Google Drive.');}
      }else toast('Os dados deste navegador já são os mais novos.');
    }else if(!D) toast('Não achei dados do CRM no Google Drive desta conta.');
    const fin=await driveAchar(FIN_FILE);
    if(fin){
      finFileId=fin.id;
      const nf=await driveBaixar(fin.id), tn=Date.parse(nf&&nf.updatedAt)||0, tl=Date.parse(F.updatedAt)||0;
      if(tn>tl){F=Object.assign(finPadrao(),nf);try{localStorage.setItem(FIN_KEY,JSON.stringify(F));}catch(e){}render();}
      else if(tl>tn) finFileId=(await driveGravarFin()).id||finFileId;
    }else if(F.updatedAt) finFileId=(await driveGravarFin()).id||finFileId;
    setDrive('ok');
  }catch(e){console.warn('Drive:',e);setDrive('erro','Erro ao sincronizar com o Google Drive');}
  driveBusy=false;
}
function driveEnviarFin(){
  if(!accessToken) return;
  clearTimeout(finTimer);
  finTimer=setTimeout(async()=>{
    if(Date.now()>tokenExp){tokenClient.requestAccessToken({prompt:''});return;} // o callback sincroniza
    try{setDrive('sinc');finFileId=(await driveGravarFin()).id||finFileId;setDrive('ok');}
    catch(e){console.warn('Drive:',e);setDrive('erro','Não consegui salvar os custos no Drive (ficaram salvos neste navegador)');}
  },1000);
}

// ══════════════════════════════════════════════
// ══ EVENTOS ══
// ══════════════════════════════════════════════
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-acao]'); if(!b) return;
  const a=b.dataset.acao, alvo=b.dataset.alvo;
  if(a==='ir'){const el=document.querySelector(alvo);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='fixos') abrirDialogo(alvo);
  else if(a==='drive') driveClick();
  else if(a==='importar') document.getElementById('arquivo').click();
  else if(a==='fechar') document.getElementById('dlg').close();
  else if(a==='fx-salvar') salvarCusto();
  else if(a==='fx-cancelar'){editando=null;renderDialogo();}
  else if(a==='fx-edit'){editando=alvo;renderDialogo();setTimeout(()=>document.getElementById('fx-desc').focus(),20);}
  else if(a==='fx-del'){const c=F.custos.find(x=>x.id===alvo);if(c&&confirm(`Excluir "${c.desc}"?`)){F.custos=F.custos.filter(x=>x.id!==alvo);salvarFin();render();}}
  else if(a==='sug-add'){
    const s=sugestoesFixos().find(x=>x.chave===alvo); if(!s) return;
    F.custos.push({id:uid(),desc:s.desc,cat:s.catFixo,valor:Math.round(s.valor*100)/100,dia:s.dia,inicio:null,fim:null,ativo:true,vinculo:s.chave});
    salvarFin(); render(); toast(`"${s.desc}" adicionado aos custos fixos.`);
  }
  else if(a==='sug-ign'){F.ignorados=(F.ignorados||[]).concat(alvo);salvarFin();renderDialogo();}
  else if(a==='sd-salvar') salvarSaldo();
});
document.addEventListener('input',e=>{
  if(e.target.closest('#dlg')){erro('fx-err','');erro('sd-err','');}
});
document.addEventListener('change',e=>{
  if(e.target.id==='sel-mes'){mesRef=e.target.value;render();}
  if(e.target.id==='chk-prev'){F.previsaoVendas=e.target.checked;salvarFin();render();}
});
document.getElementById('arquivo').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.vendas)) throw new Error('O arquivo não parece um backup do CRM (faltam as vendas).');
    usarDados(d,{tipo:'arquivo',quando:f.lastModified?new Date(f.lastModified).toISOString():null,nome:f.name});
    toast('Backup carregado. Nada foi gravado no CRM.');
  }catch(err){toast('Não consegui abrir o arquivo: '+err.message);}
});
// Atualiza sozinho quando o CRM, aberto em outra aba, salva algo
window.addEventListener('storage',e=>{
  if(e.key===CRM_KEY&&(fonte.tipo==='local'||!D)) carregarLocal();
  if(e.key===FIN_KEY){F=carregarFin();render();}
});
let rsz=null;
window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(M)desenharGraficos();},150);});

if(!carregarLocal()) render();
</script>
